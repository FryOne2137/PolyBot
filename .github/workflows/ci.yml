name: Public source checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Enable the Windows C++ compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "C++ Build Tools were not found" }
          $devscript = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
          $environment = cmd /s /c "`"`"$devscript`" >nul && set`""
          if ($LASTEXITCODE -ne 0) { throw "C++ environment initialization failed" }
          foreach ($line in $environment) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=') { $line >> $env:GITHUB_ENV }
          }
      - name: Install CPU PyTorch and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Verify native environment
        run: python scripts/check_environment.py --smoke
      - name: Test
        run: python -m pytest
      - name: Check public documentation and source tree
        run: |
          python scripts/check_docs.py
          python scripts/audit_public.py
      - name: Build the source-only publication candidate
        if: runner.os == 'Linux'
        run: python scripts/export_public.py --output dist/polybot-public.zip
      - name: Upload source candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: polybot-source
          path: dist/polybot-public.zip
          if-no-files-found: error
          retention-days: 7
