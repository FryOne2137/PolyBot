   <g id="text_24">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526479" x="36" y="688.167949" transform="rotate(-0 36 688.167949)">Flat policy/value inference uses the direct path and skips particles and search. Belief readiness alone does not establish playing strength.</text>
