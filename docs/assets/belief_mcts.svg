   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f45" x="36" y="45.835312" transform="rotate(-0 36 45.835312)">Belief-guided search and the supervision boundary</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526479" x="36" y="80.027754" transform="rotate(-0 36 80.027754)">The engine owns the hidden state. Search receives accepted detached hypotheses; PolyBot owns all neural losses.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2457a7" x="51.12" y="180.827305" transform="rotate(-0 51.12 180.827305)">PUBLIC PLAYER VIEW</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 215.005031)">Visible map + history + global features</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 231.590031)">Current public legal action list</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="375.12" y="180.827305" transform="rotate(-0 375.12 180.827305)">NEURAL MODEL</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(375.12 215.320312)">Policy priors and value estimates</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(375.12 232.370313)">Belief distributions → sampled worlds</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="375.12" y="339.227305" transform="rotate(-0 375.12 339.227305)">VALIDATE AND MATERIALIZE</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(375.12 373.405031)">Preserve observed tiles and public actions</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(375.12 389.990031)">Reject / retry inconsistent hypotheses</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85b0e" x="756.72" y="339.227305" transform="rotate(-0 756.72 339.227305)">NATIVE SEARCH</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(756.72 374.441594)">Detached-world C++ PUCT</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(756.72 389.990031)">Batched policy/value leaves</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="1044.72" y="339.227305" transform="rotate(-0 1044.72 339.227305)">ROOT DECISION</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 373.405031)">Accepted visit distribution</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 389.990031)">Select a real legal action</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="1044.72" y="180.827305" transform="rotate(-0 1044.72 180.827305)">REAL GAME STEP</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 215.005031)">Execute in the actual engine</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 231.590031)">Observe public view / result</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a43131" x="51.12" y="512.027305" transform="rotate(-0 51.12 512.027305)">HIDDEN GROUND TRUTH</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 546.205031)">Training-only semantic labels</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 563.826594)">Never an inference observation</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 580.411594)">Never the oracle search world</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526479" x="375.12" y="512.027305" transform="rotate(-0 375.12 512.027305)">POLYBOT OPTIMIZATION</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(375.12 546.520313)">Policy: accepted MCTS visits; value: outcomes / configured bootstraps</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(375.12 563.570312)">Belief: hidden-map labels plus discrepancy-guided supervision masks</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(375.12 580.620312)">No gradients or neural loss are computed inside PolyEnv</text>
   </g>
