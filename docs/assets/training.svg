   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f45" x="36" y="45.835312" transform="rotate(-0 36 45.835312)">Three explicit training jobs</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526479" x="36" y="80.027754" transform="rotate(-0 36 80.027754)">Shared checkpoint format; separate objectives, collectors and readiness checks. A completed run does not imply a promotion.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="36" y="126" transform="rotate(-0 36 126)">01  FLAT · POLICY / VALUE</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="51.12" y="170.027305" transform="rotate(-0 51.12 170.027305)">PUBLIC SELF-PLAY</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 204.520313)">Freeze behavior weights per fragment</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 222.635938)">Native VectorGameEnv collection</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="51.12" y="285.227305" transform="rotate(-0 51.12 285.227305)">OPTIMIZE</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 320.224766)">Fresh PPO/GAE; scheduled PPG</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 336.770313)">Optional terminal head-only value fit</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="51.12" y="400.427305" transform="rotate(-0 51.12 400.427305)">PROTECT WORKING / BEST</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 434.920313)">Fixed development benchmark</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 451.970313)">Paired regression confirmation</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="51.12" y="515.627305" transform="rotate(-0 51.12 515.627305)">MEASURE AND CONTINUE</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 550.120313)">Independent promotion games</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 567.803672)">Main / archive / PFSP for later collection</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="468" y="126" transform="rotate(-0 468 126)">02  BELIEF · HIDDEN MAP</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="483.12" y="170.027305" transform="rotate(-0 483.12 170.027305)">COLLECT SUPERVISION</text>
   </g>
   <g id="text_14">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(483.12 205.585938)">Public observations and action evidence</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(483.12 221.570313)">Full-map semantics are training labels</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="483.12" y="285.227305" transform="rotate(-0 483.12 285.227305)">FREEZE THE ACTOR</text>
   </g>
   <g id="text_16">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(483.12 319.720313)">Keep shared encoder and policy fixed</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(483.12 336.770313)">Train belief-specific decoder layers</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="483.12" y="400.427305" transform="rotate(-0 483.12 400.427305)">CHECK WORLD PROPOSALS</text>
   </g>
   <g id="text_18">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(483.12 434.920313)">Compare public legal action sets</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(483.12 451.970313)">Use discrepancies to focus map losses</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="483.12" y="515.627305" transform="rotate(-0 483.12 515.627305)">VALIDATE</text>
   </g>
   <g id="text_20">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(483.12 551.185938)">Held-out mismatch and semantic metrics</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(483.12 567.170313)">Save ready apprentice or roll back</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 12.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85b0e" x="900" y="126" transform="rotate(-0 900 126)">03  MCTS · POLICY / VALUE</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85b0e" x="915.12" y="170.027305" transform="rotate(-0 915.12 170.027305)">REQUIRE A USEFUL TEACHER</text>
   </g>
   <g id="text_23">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(915.12 204.520313)">Validated belief + raw/search preflight</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(915.12 221.570313)">Same maps and frozen opponent</text>
   </g>
   <g id="text_24">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85b0e" x="915.12" y="285.227305" transform="rotate(-0 915.12 285.227305)">FROZEN SEARCH COLLECTION</text>
   </g>
   <g id="text_25">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(915.12 320.224766)">Detached worlds; batched neural leaves</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(915.12 336.770313)">C++ SelfPlayPool select / simulate / backup</text>
   </g>
   <g id="text_26">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85b0e" x="915.12" y="400.427305" transform="rotate(-0 915.12 400.427305)">LEARN SEARCH TARGETS</text>
   </g>
   <g id="text_27">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(915.12 434.920313)">Visits + outcomes / configured bootstraps</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(915.12 451.970313)">Bounded replay and optimization blocks</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85b0e" x="915.12" y="515.627305" transform="rotate(-0 915.12 515.627305)">GATE</text>
   </g>
   <g id="text_29">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(915.12 550.120313)">Search quality and raw-policy absorption</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(915.12 567.170313)">Independent promotion or rollback</text>
   </g>
   <g id="text_30">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526479" x="36" y="688.167949" transform="rotate(-0 36 688.167949)">Keep evaluation maps out of training replay. Invalid measurement, weak search and failed model promotion are different outcomes.</text>
   </g>
  </g>
 </g>
