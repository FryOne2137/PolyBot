   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f45" x="36" y="45.835312" transform="rotate(-0 36 45.835312)">PolyBot · one shared network, two decision paths</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526479" x="36" y="80.027754" transform="rotate(-0 36 80.027754)">Public observations and legal actions in; policy, value and optional belief out. Architecture is selected by the checkpoint.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2457a7" x="51.12" y="188.027305" transform="rotate(-0 51.12 188.027305)">PUBLIC INPUT</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 222.520312)">Player-view map: T × 23</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 239.570312)">Global features + event summary</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 256.620313)">Visible history: H × 12</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 273.670313)">Current legal candidates only</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(51.12 290.720312)">Action semantics, costs, pointers</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="339.12" y="188.027305" transform="rotate(-0 339.12 188.027305)">SHARED MAP / HISTORY ENCODER</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 222.520312)">Semantic embeddings + 2-D positions</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 239.570312)">History Transformer → global context</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 256.620313)">L-layer map Transformer</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 273.670313)">Contextual tile states + global token</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 290.720312)">Relational variant: spatial readout</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 307.770313)">Mean / max / learned visible pooling</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="699.12" y="152.027305" transform="rotate(-0 699.12 152.027305)">POLICY</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(699.12 186.205031)">Type + options + global context</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(699.12 202.790031)">Source–target / query–tile interactions</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(699.12 219.375031)">One masked logit per legal action</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85b0e" x="699.12" y="324.827305" transform="rotate(-0 699.12 324.827305)">VALUE</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(699.12 359.320312)">Spatial state → scalar in [−1, 1]</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(699.12 376.370312)">Game outcomes supervise the critic</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7341a6" x="339.12" y="497.627305" transform="rotate(-0 339.12 497.627305)">OPTIONAL BELIEF DECODER</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 532.120312)">Public legal-action evidence</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 549.170313)">Private spatial refinement</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(339.12 566.220312)">Structured hidden-world hypotheses</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #18724b" x="1044.72" y="152.027305" transform="rotate(-0 1044.72 152.027305)">FLAT ACTION SELECTION</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 186.205031)">Policy → real legal action</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 202.790031)">Native VectorGameEnv step</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 219.375031)">No particles or tree required</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85b0e" x="1044.72" y="353.627305" transform="rotate(-0 1044.72 353.627305)">OPTIONAL BELIEF-MCTS</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 388.841594)">Validate detached worlds</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 404.390031)">Policy/value guide C++ PUCT</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 420.975031)">Native SelfPlayPool trees</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 437.560031)">Visits become policy labels</text>
    <text style="font-size: 10.7px; font-family: 'DejaVu Sans'; fill: #24394d" transform="translate(1044.72 454.145031)">Separate search/readiness gates</text>
   </g>
